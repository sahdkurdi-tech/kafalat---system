<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەرشیف</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <link rel="stylesheet" href="css/archive.css">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#517da2">

    <style id="custom-design-styles">
        /* پاراستنی UI بۆ ستاف */
        body:not(.is-admin) .admin-only {
            display: none !important;
        }

        /* =========================================
           دیزاینی دەسکتاپ
           ========================================= */
        #sidebar {
            width: 260px;
            background-color: #ffffff !important;
            color: #000000 !important;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1) !important;
            border-left: 1px solid #e0e0e0;
            display: flex !important;
            flex-direction: column !important; 
            flex-shrink: 0;
            z-index: 1050;
        }
        .sidebar-brand {
            background-color: #517da2 !important;
            color: #ffffff !important;
            padding: 30px 20px 20px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            border-bottom: none !important;
        }
        .sidebar-brand-icon {
            width: 85px; height: 85px; 
            background-color: #ffffff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            overflow: hidden; 
            border: 3px solid #ffffff;
        }
        .sidebar-brand-icon img {
            width: 100%; height: 100%; object-fit: cover;
        }
        #sidebar .nav-link {
            color: #000000 !important; font-weight: 500 !important;
            padding: 14px 20px !important; display: flex !important; align-items: center !important;
            gap: 22px !important; border-radius: 0 !important; transition: background 0.2s !important;
        }
        #sidebar .nav-link i {
            font-size: 1.3rem !important; color: #707579; width: 26px !important; text-align: center !important;
        }
        #sidebar .nav-link:hover, #sidebar .nav-link.active { background-color: #f4f4f5 !important; }
        #sidebar .nav-link.active i { color: #517da2 !important; }
        #sidebar .nav-link.text-danger, #sidebar .nav-link.text-danger i { color: #e53935 !important; }

        /* گونجاندنی دوگمەکانی ئەرشیف بۆ دیزاینە نوێیەکە */
        #dynamic-archive-list .nav-btn, #dynamicListNavMobile .nav-btn {
            background: transparent !important;
            color: #000000 !important;
            font-weight: 500 !important;
            padding: 12px 20px !important;
            display: flex !important;
            align-items: center !important;
            gap: 15px !important;
            border-radius: 0 !important;
            transition: background 0.2s !important;
            border: none !important;
            width: 100%;
            text-align: right;
            margin-bottom: 2px;
        }
        #dynamic-archive-list .nav-btn i, #dynamicListNavMobile .nav-btn i {
            font-size: 1.2rem !important;
            color: #517da2 !important;
            width: 26px !important;
            text-align: center !important;
        }
        #dynamic-archive-list .nav-btn:hover, #dynamicListNavMobile .nav-btn:hover {
            background-color: #f4f4f5 !important;
        }

        /* =========================================
           دیزاینی مۆبایل
           ========================================= */
        @keyframes spinLight {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (min-width: 992px) {
            .modern-navbar { display: none !important; }
        }

        @media (max-width: 991px) {
            #sidebar { display: none !important; } 
            
            .main-content {
                padding-top: 110px !important; 
                margin-right: 0 !important;
                height: auto !important;
                overflow-y: visible !important;
            }
            body { display: block !important; overflow-y: auto !important; }

            .modern-navbar {
                background: transparent !important; border: none !important; box-shadow: none !important;
                padding: 2px; border-radius: 52px; position: fixed; top: 15px; left: 0; right: 0;
                margin-left: auto; margin-right: auto; z-index: 1050; overflow: hidden; transition: border-radius 0.3s ease;
            }

            .modern-navbar::before {
                content: ""; position: absolute; width: 200%; height: 1500px; top: 50%; left: 50%;
                margin-left: -100%; margin-top: -750px;
                background: conic-gradient( transparent 0%, transparent 40%, #517da2 50%, transparent 60%, transparent 90%, #517da2 100% );
                animation: spinLight 3s linear infinite; z-index: -1;
            }

            .navbar-inner-bg {
                background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
                border-radius: 50px; width: 100%; display: flex; flex-wrap: wrap; align-items: center;
                justify-content: space-between; padding: 8px 18px; transition: border-radius 0.3s ease;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }

            .modern-navbar.menu-open { border-radius: 22px; }
            .modern-navbar.menu-open .navbar-inner-bg { border-radius: 20px; }

            #navbarNav {
                background: transparent; border-radius: 0; padding: 0; box-shadow: none; position: static; margin-top: 10px; width: 100%;
                max-height: 70vh; overflow-y: auto;
            }

            #navbarNav .navbar-nav { width: 100%; padding: 0 5px; }
            #navbarNav .nav-item { width: 100%; margin-bottom: 8px; }
            
            #navbarNav .nav-link {
                width: 100%; text-align: center; padding: 12px 15px; background-color: #f8fafc; 
                border-radius: 12px; display: flex; align-items: center; justify-content: center;
                transition: all 0.3s ease; border: 1px solid transparent; color: #333 !important;
            }
            #navbarNav .nav-link i { margin-left: 10px; font-size: 1.2rem; color: #517da2; }
            #navbarNav .nav-link:hover { background-color: #f1f5f9; }
        }
    </style>
</head>
<body>

    <nav class="navbar modern-navbar mx-auto d-lg-none d-print-none" style="max-width: 92%;">
        <div class="navbar-inner-bg">
            <a class="navbar-brand d-flex align-items-center m-0 text-dark fw-bold gap-3" href="index.html" style="font-size: 1.25rem; letter-spacing: 1.5px;">
                <img src="icon-512.png" alt="لۆگۆ" width="48" height="48" class="rounded-circle object-fit-cover border shadow-sm"> MROVDOSTAN
            </a>
            <button class="navbar-toggler border-0 shadow-none p-0" type="button" id="mobileMenuToggler">
                <i class="fa-solid fa-bars-staggered fa-lg" style="color: #517da2;"></i>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav align-items-center w-100 pt-3">
                    <li class="nav-item border-top pt-2 mt-1 w-100">
                        <a class="nav-link fw-bold text-dark" href="index.html">
                            <i class="fa-solid fa-arrow-right"></i> گەڕانەوە بۆ سەرەکی
                        </a>
                    </li>
                    <li class="nav-item w-100 pt-3 pb-2 text-center text-muted fw-bold border-top mt-2">
                        <i class="fas fa-folder-open me-2 text-primary"></i> لیستی ئەرشیفەکان
                    </li>
                    
                    <div id="dynamicListNavMobile" class="w-100"></div>
                </ul>
            </div>
        </div>
    </nav>

    <div class="sidebar d-none d-lg-flex d-print-none" id="sidebar">
        
        <div class="sidebar-brand flex-shrink-0">
            <div class="sidebar-brand-icon">
                <img src="icon-512.png" alt="MROVDOSTAN">
            </div>
            <div class="mt-3 text-center w-100">
                <div class="fw-bold" style="font-size: 1.2rem; letter-spacing: 1.5px;">MROVDOSTAN</div>
            </div>
        </div>

        <div class="flex-grow-1 overflow-auto mt-3">
            <nav class="nav flex-column w-100">
                <a class="nav-link fw-bold text-muted px-3 mb-2" style="cursor: default;"><i class="fas fa-folder-open"></i> لیستی ئەرشیفەکان</a>
                
                <div id="dynamic-archive-list" class="w-100">
                    <p class="text-center text-muted mt-3"><i class="fas fa-spinner fa-spin"></i> باردەکرێت...</p>
                </div>
            </nav>
        </div>

        <div class="flex-shrink-0 border-top mt-auto">
            <nav class="nav flex-column w-100 pb-3 pt-1">
                <a class="nav-link text-dark fw-bold" href="index.html"><i class="fas fa-arrow-right"></i> گەڕانەوە بۆ سەرەکی</a>
            </nav>
        </div>

    </div>

    <div class="main-content">
        
        <div id="page-title-container" class="mb-4 pb-2 border-bottom">
            <h2 id="page-title" class="text-dark fw-bold">هەڵبژاردنی ئەرشیف</h2>
        </div>

        <div id="months-view" class="months-grid"></div>

        <div id="details-view">
            <div class="header-bar">
                <h3 id="archive-header-title" class="m-0 fw-bold text-primary">وردەکاری</h3>
                <div class="action-btns d-flex gap-2">
                    <button class="btn btn-dark" onclick="preparePrint()"><i class="fas fa-print"></i> پرینت</button>
                    <button class="btn btn-secondary" onclick="closeDetails()"><i class="fas fa-times"></i> داخستن</button>
                </div>
            </div>
            
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle" id="archive-table">
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="printable-area">
        <h1 id="print-simple-title"></h1>
        <div id="print-table-container"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/archive.js"></script>

    <script>
        window.closeMobileMenu = function() {
            const navMenu = document.getElementById('navbarNav');
            const navbar = document.querySelector('.modern-navbar');
            if(navMenu && navMenu.classList.contains('show')) {
                navMenu.classList.remove('show');
                navbar.classList.remove('menu-open');
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('mobileMenuToggler');
            const navMenu = document.getElementById('navbarNav');
            const navbar = document.querySelector('.modern-navbar'); 

            if (toggleBtn && navMenu && navbar) {
                toggleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    navMenu.classList.toggle('show');
                    navbar.classList.toggle('menu-open');
                });

                document.addEventListener('click', (e) => {
                    if (navMenu.classList.contains('show') && !navMenu.contains(e.target) && !toggleBtn.contains(e.target)) {
                        closeMobileMenu();
                    }
                });
            }

            // لۆجیکی ڕاستکراوە بۆ کارکردنی دوگمەکانی ئەرشیف لە مۆبایل
            const desktopNav = document.getElementById('dynamic-archive-list');
            const mobileNav = document.getElementById('dynamicListNavMobile');
            
            if(desktopNav && mobileNav) {
                const syncNavs = () => {
                    mobileNav.innerHTML = '';
                    Array.from(desktopNav.children).forEach(child => {
                        if (child.tagName === 'P') return; // تێپەڕاندنی وشەی باردەکرێت...
                        
                        const li = document.createElement('li');
                        li.className = 'nav-item w-100';
                        
                        // دروستکردنی لینکی نوێ لەبری کۆپیکردنی شێوەکە بۆ ئەوەی کلیکەکە کاربکات
                        const a = document.createElement('a');
                        a.className = 'nav-link fw-bold w-100 text-dark';
                        a.innerHTML = child.innerHTML; 
                        
                        // گرنگترین بەش: پەیوەستکردنی کلیکی مۆبایلەکە بە دوگمە ڕەسەنەکەی لاپتۆپ
                        a.onclick = (e) => {
                            e.preventDefault();
                            child.click(); // جێبەجێکردنی فەرمانەکە وەک ئەوەی لە لاپتۆپ کلیکت کردبێت
                            closeMobileMenu();
                        };
                        a.style.cursor = 'pointer';
                        
                        li.appendChild(a);
                        mobileNav.appendChild(li);
                    });
                };

                const observer = new MutationObserver(syncNavs);
                observer.observe(desktopNav, { childList: true, subtree: true });
            }
        });
    </script>

</body>
</html>
